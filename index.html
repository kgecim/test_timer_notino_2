<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--accent-active:#0284c7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.widget{width:100%;max-width:290px;padding:5px;margin:0 auto}
.header{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.trackers{display:grid;gap:5px}
.tracker{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.tracker.active{border-color:var(--accent);background:#0f2238}
.name{font-size:11px;font-weight:550;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracker.active .name{color:var(--accent)}
.right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.time{font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tracker.active .time{color:#bae6fd}
.dot{width:8px;height:8px;border-radius:50%;background:#1e293b;border:1px solid var(--muted)}
.tracker.active .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px rgba(56,189,248,.6)}
@media(prefers-reduced-motion:no-preference){.tracker,.dot{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<main class="widget">
  <div class="header">Timer</div>
  <section class="trackers" id="trackers">
    <div class="tracker" data-id="bachelor" onclick="toggle('bachelor')">
      <span class="name">Bachelor Finishen</span>
      <div class="right"><span class="time" id="t-bachelor">00:00</span><div class="dot"></div></div>
    </div>
    <div class="tracker" data-id="startup" onclick="toggle('startup')">
      <span class="name">StartUp Gründen</span>
      <div class="right"><span class="time" id="t-startup">00:00</span><div class="dot"></div></div>
    </div>
    <div class="tracker" data-id="Backyard" onclick="toggle('Backyard')">
      <span class="name">Backyard 24h</span>
      <div class="right"><span class="time" id="t-Backyard">00:00</span><div class="dot"></div></div>
    </div>
    <div class="tracker" data-id="curiosity" onclick="toggle('curiosity')">
      <span class="name">Curiosity</span>
      <div class="right"><span class="time" id="t-curiosity">00:00</span><div class="dot"></div></div>
    </div>
  </section>
</main>
<script>
(()=>{
 const KEY="notion-sidebar-timer-v2";
 const ids=["bachelor","startup","Backyard","curiosity"];
 const today=()=>new Date().toDateString();
 let state={date:today(),active:null,sec:{bachelor:0,startup:0,Backyard:0,curiosity:0}};
 try{
   const saved=JSON.parse(localStorage.getItem(KEY));
   if(saved&&saved.date===today())state=saved;
 }catch(e){}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
 const fmt=s=>`${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}`;
 function render(){
   ids.forEach(id=>{
     document.getElementById(`t-${id}`).textContent=fmt(state.sec[id]);
     document.querySelector(`[data-id="${id}"]`).classList.toggle("active",state.active===id);
   });
 }
 window.toggle=id=>{
   state.active=state.active===id?null:id;
   save();render();
 };
 setInterval(()=>{
   if(state.date!==today()){
     state={date:today(),active:null,sec:{bachelor:0,startup:0,Backyard:0,curiosity:0}};
     save();render();
   }else if(state.active){
     state.sec[state.active]++;
     save();
     document.getElementById(`t-${state.active}`).textContent=fmt(state.sec[state.active]);
   }
 },1000);
 render();
})();
</script>
</body>
</html>
